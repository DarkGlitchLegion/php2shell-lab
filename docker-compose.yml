services:
  php2shell-lab:
    build:
      context: .
      target: runtime
    environment:
      APP_NAME: PHP2Shell-Lab
      APP_KEY: ${APP_KEY:?Generate APP_KEY with php artisan key:generate}
      APP_URL: http://localhost:8080
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      LAB_OS_EXECUTION_ENABLED: "true"
      LAB_SESSION_LAB_ENABLED: "true"
      PHP2SHELL_CTF_ENABLED: "true"
      PHP2SHELL_CTF_FLAG: ${PHP2SHELL_CTF_FLAG:-FLAG{php2shell_local_practice}}
      PHP2SHELL_VULNERABLE_URL: http://php2shell-vulnerable:8080/runtime-info.php
      PHP2SHELL_PATCHED_URL: http://php2shell-patched:8080/runtime-info.php
      PHP2SHELL_VULNERABLE_TERMINAL_URL: http://127.0.0.1:7681
      PHP2SHELL_PATCHED_TERMINAL_URL: http://127.0.0.1:7682
      PHP2SHELL_CTF_TARGET_URL: http://127.0.0.1:8082/runtime-info.php
      PHP2SHELL_CTF_PATCHED_TARGET_URL: http://127.0.0.1:8083/runtime-info.php
    ports:
      - "127.0.0.1:8080:8000"
    networks:
      - frontend
      - vulnerable
      - patched
    depends_on:
      php2shell-vulnerable:
        condition: service_started
      php2shell-patched:
        condition: service_started
      terminal-proxy:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
      - /var/www/html/storage/framework/cache:rw,noexec,nosuid,size=16m,uid=33,gid=33
      - /var/www/html/storage/framework/sessions:rw,noexec,nosuid,size=16m,uid=33,gid=33
      - /var/www/html/storage/framework/views:rw,noexec,nosuid,size=16m,uid=33,gid=33
      - /var/www/html/storage/logs:rw,noexec,nosuid,size=8m,uid=33,gid=33
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0

  php2shell-vulnerable:
    container_name: php2shell-vulnerable
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
      args:
        PHP_BASE_IMAGE: php:8.5.11-apache-bookworm
        LAB_RUNTIME_EXPECTED_VERSION: "8.5.11"
    environment:
      LAB_RUNTIME_EXPECTED_VERSION: "8.5.11"
      PHP2SHELL_CTF_FLAG: ${PHP2SHELL_CTF_FLAG:-FLAG{php2shell_local_practice}}
    networks:
      - vulnerable
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777,uid=33,gid=33
      - /var/run/apache2:rw,noexec,nosuid,size=4m,uid=33,gid=33
      - /var/lock/apache2:rw,noexec,nosuid,size=4m,uid=33,gid=33
      - /var/log/apache2:rw,noexec,nosuid,size=16m,uid=33,gid=33
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains((string) @file_get_contents('http://127.0.0.1:8080/runtime-info.php'), '\"terminal_status\":\"ok\"') ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  php2shell-patched:
    container_name: php2shell-patched
    build:
      context: .
      dockerfile: docker/runtime/Dockerfile
      args:
        PHP_BASE_IMAGE: php:8.5.12-apache-bookworm
        LAB_RUNTIME_EXPECTED_VERSION: "8.5.12"
    environment:
      LAB_RUNTIME_EXPECTED_VERSION: "8.5.12"
    networks:
      - patched
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,mode=1777,uid=33,gid=33
      - /var/run/apache2:rw,noexec,nosuid,size=4m,uid=33,gid=33
      - /var/lock/apache2:rw,noexec,nosuid,size=4m,uid=33,gid=33
      - /var/log/apache2:rw,noexec,nosuid,size=16m,uid=33,gid=33
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains((string) @file_get_contents('http://127.0.0.1:8080/runtime-info.php'), '\"terminal_status\":\"ok\"') ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  terminal-proxy:
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - "127.0.0.1:7681:8080"
      - "127.0.0.1:7682:8081"
      - "127.0.0.1:8082:8082"
      - "127.0.0.1:8083:8083"
    volumes:
      - ./docker/terminal-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend
      - vulnerable
      - patched
    depends_on:
      php2shell-vulnerable:
        condition: service_healthy
      php2shell-patched:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.5

  php2shell-tests:
    profiles:
      - test
    build:
      context: .
      target: test
    environment:
      APP_NAME: PHP2Shell-Lab
      APP_KEY: ${APP_KEY:?Generate APP_KEY with php artisan key:generate}
      APP_ENV: testing
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LAB_OS_EXECUTION_ENABLED: "false"
      LAB_SESSION_LAB_ENABLED: "true"
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /var/www/html/storage/framework/cache:rw,noexec,nosuid,size=16m,uid=33,gid=33
      - /var/www/html/storage/framework/sessions:rw,noexec,nosuid,size=16m,uid=33,gid=33
      - /var/www/html/storage/framework/views:rw,noexec,nosuid,size=16m,uid=33,gid=33
      - /var/www/html/storage/framework/testing:rw,noexec,nosuid,size=16m,uid=33,gid=33
      - /var/www/html/storage/logs:rw,noexec,nosuid,size=8m,uid=33,gid=33
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    command: ["php", "artisan", "test"]

networks:
  frontend:
    driver: bridge
  vulnerable:
    internal: true
  patched:
    internal: true
